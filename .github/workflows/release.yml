name: Release

# Push a tag vX.Y.Z from main, or from an lts/X.Y branch for an LTS patch (ADR 0019, 0020).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openasy/dast-agent

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      lts: ${{ steps.branch.outputs.lts }}
      lts-eol: ${{ steps.branch.outputs.lts-eol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"

      - name: Check the tag is on main or an LTS branch
        id: branch
        run: |
          branches=$(git branch -r --contains "$GITHUB_SHA")
          echo "$branches"
          if echo "$branches" | grep -Eq '^\s*origin/lts/[0-9]+\.[0-9]+$'; then
            test -s .github/lts-eol || { echo "lts branches need .github/lts-eol (YYYY-MM-DD)"; exit 1; }
            echo "lts=true" >> "$GITHUB_OUTPUT"
            echo "lts-eol=$(cat .github/lts-eol)" >> "$GITHUB_OUTPUT"
          elif echo "$branches" | grep -Eq '^\s*origin/main$'; then
            echo "lts=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${GITHUB_REF_NAME} is not on main or an lts/X.Y branch"; exit 1
          fi

      # ADR 0019: an agent always has the same version as its product, so dast ships first.
      - name: Check dast with the same version is published
        run: docker manifest inspect "ghcr.io/openasy/dast:${GITHUB_REF_NAME#v}" > /dev/null

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags X.Y.Z, X.Y and X; never latest (ADR 0019). 0.x gets no major tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=dast-agent
            org.opencontainers.image.vendor=OpenAsy
            org.openasy.lts=${{ needs.test.outputs.lts }}
            org.openasy.lts.eol=${{ needs.test.outputs.lts-eol }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # SLSA L3 provenance comes from the provenance job
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      # ZAP, Java and a browser make an SBOM larger than the public transparency log takes. The attestation is signed
      # the same way but kept out of the log, with a signed timestamp in its place; the signature and the provenance
      # are in the log as for every image (ADR 0027). cosign's signing config refuses a timestamp server given here, so
      # it is left out.
      - name: Attach the SBOM as a signed attestation
        run: >-
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json --use-signing-config=false
          --tlog-upload=false --timestamp-server-url https://timestamp.sigstore.dev/api/v1/timestamp
          "${IMAGE}@${{ steps.build.outputs.digest }}"

  provenance:
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    # Reusable workflows must be referenced by tag, not SHA, for SLSA L3.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/openasy/dast-agent
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [image, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            cosign verify ${{ env.IMAGE }}@${{ needs.image.outputs.digest }} \
              --certificate-identity-regexp '^https://github.com/openasy/dast-agent/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            # The SBOM attestation has a signed timestamp in place of a transparency log entry:
            cosign verify-attestation --type spdxjson --insecure-ignore-tlog --use-signed-timestamps \
              ${{ env.IMAGE }}@${{ needs.image.outputs.digest }} \
              --certificate-identity-regexp '^https://github.com/openasy/dast-agent/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
